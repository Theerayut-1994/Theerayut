<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTTO PRO</title>

<style>
body { font-family: Arial; margin:10px; background:#f5f5f5; }
input, button { width:100%; padding:12px; font-size:16px; margin:5px 0; }
.row { display:flex; gap:5px; }
label { font-weight:bold; }
table { width:100%; border-collapse:collapse; margin-top:10px; background:white; }
th, td { border:1px solid #ccc; padding:6px; text-align:center; }
.delete { color:red; cursor:pointer; }
</style>
</head>

<body>

<h3>LOTTO PRO</h3>

<label>ผู้บันทึกข้อมูล</label>
<input id="username">

<label>หมายเลข 3 ตัว</label>
<input id="numbers" inputmode="numeric" maxlength="3">

<div class="row">
<div style="flex:1">
<label>บน</label>
<input id="direct" inputmode="numeric">
</div>
<div style="flex:1">
<label>โต๊ด</label>
<input id="tod" inputmode="numeric">
</div>
</div>

<button onclick="addItem()">เพิ่มรายการ</button>

<h4>ประวัติ</h4>
<table id="table">
<tr>
<th>#</th>
<th>เลข</th>
<th>บน</th>
<th>โต๊ด</th>
<th>คนคีย์</th>
<th>ลบ</th>
</tr>
</table>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwUaaLen3MSflYE0x5bMVYdcaibezNY5vEvPd8hXkNIgD8jHNneJCpOWIsze3TZKrkNNw/exec";

let data=[];

// โหลดข้อมูล
function loadData(){
  fetch(API_URL)
    .then(res => res.json())
    .then(res => {
      data = res; // 👈 ไม่ reverse ตรงนี้
      render();
    });
}

// โหลด username (session)
window.onload = function(){
  loadData();
  let user = sessionStorage.getItem("user");
  if(user) username.value = user;
}

// บันทึกชื่อ
username.oninput = function(){
  sessionStorage.setItem("user", this.value);
}

// บังคับเลข 3 หลัก
numbers.addEventListener("input",function(){
  this.value = this.value.replace(/\D/g,"");
  if(this.value.length > 3){
    this.value = this.value.slice(0,3);
  }
});

// permute
function perm(s){
 if(s.length<=1) return [s];
 let r=[];
 for(let i=0;i<s.length;i++){
  let rest=s.slice(0,i)+s.slice(i+1);
  perm(rest).forEach(p=>r.push(s[i]+p));
 }
 return [...new Set(r)];
}

// ตรวจเลขซ้ำ
function isDuplicate(num){
 return new Set(num).size < 3;
}

// เพิ่มรายการ
function addItem(){

 let u = username.value;
 if(!u) return alert("กรอกชื่อก่อน");

 let num = numbers.value;
 if(num.length !== 3) return alert("ต้องเป็นเลข 3 หลัก");

 let d = parseFloat(direct.value)||0;
 let t = parseFloat(tod.value)||0;

 let sendData=[];

 // 🔥 ถ้ามีโต๊ด
 if(t){

   let p = perm(num);

   // เลขซ้ำ → แตกเป็นหลายแถว (ลงบน)
   if(new Set(num).size < 3){

     let base = Math.floor(t/p.length);
     let rem = t%p.length;

     p.forEach((x,i)=>{
       let amt = base + (i<rem?1:0);
       sendData.push({num:x,d:amt,t:0,user:u});
     });

   }else{
     // 🔥 เลขปกติ → แถวเดียว
     sendData.push({num:num,d:d,t:t,user:u});
     d = 0; // กันซ้ำ
   }

 }else{
   if(d){
     sendData.push({num:num,d:d,t:0,user:u});
   }
 }

 fetch(API_URL,{
   method:"POST",
   body:JSON.stringify(sendData)
 }).then(()=>{
   loadData();
 });

}
 numbers.value="";
 direct.value="";
 tod.value="";
}

// ลบรายการ
function deleteItem(row){

 fetch(API_URL,{
   method:"POST",
   body:JSON.stringify({
     delete:true,
     row: row
   })
 }).then(()=>{
   loadData();
 });

}

// render
function render(){

 let tb=document.getElementById("table");

 tb.innerHTML = `
 <tr>
 <th>#</th><th>เลข</th><th>บน</th><th>โต๊ด</th><th>คนคีย์</th><th>ลบ</th>
 </tr>`;

 let showData = [...data].reverse(); // 👈 กลับตรงนี้

 showData.forEach((x,i)=>{

  let r=tb.insertRow();

  r.insertCell(0).innerText=i+1;
  r.insertCell(1).innerText = String(x.num).padStart(3,'0');
  r.insertCell(2).innerText = x.d ? x.d.toFixed(2) : "-";
  r.insertCell(3).innerText = x.t ? x.t.toFixed(2) : "-";
  r.insertCell(4).innerText = x.user;

  let del = r.insertCell(5);
  del.innerHTML = "❌";
  del.onclick = ()=>deleteItem(x.row); // 👈 ใช้ row จริง

 });
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTTO PRO</title>

<style>
* {
 box-sizing: border-box;
}

body {
 font-family: Arial;
 margin:0;              /* 👈 เอา margin ออก */
 padding:10px;         /* 👈 ใช้ padding แทน */
 background:#f5f5f5;
 box-sizing:border-box; /* 👈 กันล้น */
}

input, button {
 width:100%;
 padding:12px;
 font-size:16px;
 margin:5px 0;
}

label{ font-weight:bold; }

.row { display:flex; gap:20px; }

.box {
 flex:1;
 padding:10px;
 background:white;
 border-radius:8px;
 box-shadow:0 0 5px rgba(0,0,0,0.1);
}

.tag{
 background:#4CAF50;
 color:white;
 padding:6px 12px;
 border-radius:20px;
 margin:3px;
 display:inline-block;
 cursor:pointer;
}

table {
 width:100%;
 border-collapse:collapse;
 margin-top:10px;
 background:white;
}

th, td {
 border:1px solid #ccc;
 padding:6px;
 text-align:center;
}

.delete{ color:red; cursor:pointer; }
</style>
</head>

<body>

<h3>LOTTO PRO</h3>

<label>ผู้บันทึกข้อมูล</label>
<input id="username">

<label>หมายเลข 3 ตัว</label>
<input id="numbers">
<div id="tags"></div>

<div class="row">
 <div class="box">
  <label>บน</label>
  <input id="direct">
 </div>
 <div class="box">
  <label>โต๊ด</label>
  <input id="tod">
 </div>
</div>

<button onclick="addItem()">เพิ่มรายการ</button>

<table id="table"></table>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwUaaLen3MSflYE0x5bMVYdcaibezNY5vEvPd8hXkNIgD8jHNneJCpOWIsze3TZKrkNNw/exec";

let data=[];
let tags=[];

// โหลด
function loadData(){
 fetch(API_URL)
 .then(r=>r.json())
 .then(r=>{
   data=r;
   render();
 });
}

window.onload=loadData;

// tag
numbers.oninput=function(){
 let v=this.value.replace(/\D/g,"");
 if(v.length===3){
   addTag(v);
   this.value="";
 }
};

function addTag(n){
 tags.push(n);

 let t=document.createElement("span");
 t.className="tag";
 t.innerHTML=n+" ❌";

 t.onclick=()=>{
   tags=tags.filter(x=>x!=n);
   t.remove();
 };

 document.getElementById("tags").appendChild(t);
}

// permute
function perm(s){
 if(s.length<=1) return [s];
 let r=[];
 for(let i=0;i<s.length;i++){
  let rest=s.slice(0,i)+s.slice(i+1);
  perm(rest).forEach(p=>r.push(s[i]+p));
 }
 return [...new Set(r)];
}

// เพิ่ม
function addItem(){

 let u=username.value;
 let d=parseFloat(direct.value)||0;
 let t=parseFloat(tod.value)||0;

 let send=[];

 tags.forEach(num=>{

  let unique=new Set(num).size;

  // 333
  if(unique===1){
    send.push({num:num,d:d+t,t:0,user:u});
  }

  // 133
  else if(unique===2){
    let p=perm(num);
    let base=Math.floor(t/p.length);
    let rem=t%p.length;

    p.forEach((x,i)=>{
      send.push({num:x,d:base+(i<rem?1:0),t:0,user:u});
    });

    if(d) send.push({num:num,d:d,t:0,user:u});
  }

  // 123
  else{
    send.push({num:num,d:d,t:t,user:u});
  }

 });

 fetch(API_URL,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify(send)
 }).then(()=>loadData());

 tags=[];
 document.getElementById("tags").innerHTML="";
 direct.value="";
 tod.value="";
}

// ลบ
function deleteItem(row){
 fetch(API_URL+"?delete=1&row="+row)
 .then(()=>loadData());
}

// render
function render(){

 let tb=document.getElementById("table");

 tb.innerHTML=`
 <tr>
 <th>#</th><th>เลข</th><th>บน</th><th>โต๊ด</th><th>คน</th><th>ลบ</th>
 </tr>`;

 let show=[...data].reverse();

 show.forEach((x,i)=>{

  let r=tb.insertRow();

  r.insertCell(0).innerText=i+1;
  r.insertCell(1).innerText=x.num;
  r.insertCell(2).innerText=x.d||"-";
  r.insertCell(3).innerText=x.t||"-";
  r.insertCell(4).innerText=x.user;

  let del=r.insertCell(5);
  del.innerHTML="❌";
  del.onclick=()=>deleteItem(x.row);

 });

}

</script>

</body>
</html>

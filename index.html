<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTTO PRO</title>

<style>
body { font-family: Arial; margin:10px; background:#f5f5f5; }
input, button { width:100%; padding:12px; font-size:16px; margin:5px 0; }
.row { display:flex; gap:5px; }
.tag { background:#4CAF50; color:white; padding:8px 12px; border-radius:20px; margin:3px; display:inline-block; }
.tag span { margin-left:8px; cursor:pointer; }
table { width:100%; border-collapse:collapse; margin-top:10px; background:white; }
th, td { border:1px solid #ccc; padding:6px; text-align:center; }
</style>
</head>

<body>

<h3>LOTTO PRO</h3>

<input id="username" placeholder="ชื่อผู้คีย์">

<div id="tags"></div>
<input id="numbers" inputmode="numeric" placeholder="พิมพ์เลข 3 ตัว">

<div class="row">
<input id="direct" inputmode="numeric" placeholder="ตรง">
<input id="tod" inputmode="numeric" placeholder="โต๊ด">
<input id="rev" inputmode="numeric" placeholder="กลับ">
</div>

<button onclick="addItem()">เพิ่มรายการ</button>
<button onclick="clearTags()">ล้างเลข</button>

<h4>ประวัติ</h4>
<table id="table">
<tr><th>#</th><th>เลือก</th><th>เลข</th><th>ตรง</th><th>โต๊ด</th><th>คนคีย์</th></tr>
</table>

<button onclick="deleteHistory()">ลบที่เลือก</button>

<script>

function formatMoney(num) {
  return Number(num || 0).toLocaleString('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

let tags=[];
let data=[];

// โหลด
window.onload = function() {
  let saved = localStorage.getItem("lottoData");
  if(saved){
    data = JSON.parse(saved);
    render();
  }

  let user = localStorage.getItem("user");
  if(user){
    document.getElementById("username").value = user;
  }
};

// USER
username.onchange=function(){
 if(!this.value) return alert("กรอกชื่อ");
 localStorage.setItem("user",this.value);
}

// INPUT เลข 3 ตัว
numbers.addEventListener("input",function(){
 let v=this.value.replace(/\D/g,"");
 if(v.length===3){
   addTag(v);
   this.value="";
 }
});

function addTag(n){
 tags.push(n);
 let t=document.createElement("span");
 t.className="tag";
 t.innerHTML=n+" <span onclick='removeTag(this)'>❌</span>";
 document.getElementById("tags").appendChild(t);
}

function removeTag(el){
 let val=el.parentElement.innerText.replace(" ❌","");
 tags=tags.filter(x=>x!=val);
 el.parentElement.remove();
}

function clearTags(){
 tags=[];
 document.getElementById("tags").innerHTML="";
}

// กลับเลข
function perm(s){
 if(s.length<=1) return [s];
 let r=[];
 for(let i=0;i<s.length;i++){
  let rest=s.slice(0,i)+s.slice(i+1);
  perm(rest).forEach(p=>r.push(s[i]+p));
 }
 return [...new Set(r)];
}

function addItem(){
 let u=localStorage.getItem("user");
 if(!u) return alert("กรอกชื่อก่อน");

 let d=+direct.value||0;
 let t=+tod.value||0;
 let r=+rev.value||0;

 let sendData=[];

 tags.forEach(num=>{

  if(d||t){
   let item = {num,d,t,user:u};
   data.unshift(item);
   sendData.push(item);
  }

  if(r){
   let p=perm(num);
   let base=Math.floor(r/p.length);
   let rem=r%p.length;

   p.forEach((x,i)=>{
    let amt=base+(i<rem?1:0);
    let item = {num:x,d:amt,t:0,user:u};
    data.unshift(item);
    sendData.push(item);
   });
  }

 });

 render();

 fetch("https://script.google.com/macros/s/AKfycbzAPe7tqtWzltfiD_GeCvsu8OJ2RRZ5LuNlvw0VMXIa0_fUx2AdUAEBB4UrbSrZ4n-Ccg/exec", {
   method: "POST",
   body: JSON.stringify(sendData)
 });

 tags=[];
 document.getElementById("tags").innerHTML="";
 direct.value="";
 tod.value="";
 rev.value="";
 numbers.focus();

 localStorage.setItem("lottoData", JSON.stringify(data));
}

function render(){
 let tb=document.getElementById("table");
 tb.innerHTML="<tr><th>#</th><th>เลือก</th><th>เลข</th><th>ตรง</th><th>โต๊ด</th><th>คนคีย์</th></tr>";

 data.forEach((x,i)=>{
  let r=tb.insertRow();
  r.insertCell(0).innerText=i+1;
  r.insertCell(1).innerHTML='<input type="checkbox">';
  r.insertCell(2).innerText=x.num;
  r.insertCell(3).innerText=formatMoney(x.d);
  r.insertCell(4).innerText=formatMoney(x.t);
  r.insertCell(5).innerText=x.user;
 });
}

function deleteHistory(){
 let tb=document.getElementById("table");
 let newData=[];
 for(let i=1;i<tb.rows.length;i++){
  let chk=tb.rows[i].cells[1].children[0].checked;
  if(!chk) newData.push(data[i-1]);
 }
 data=newData;
 render();
 localStorage.setItem("lottoData", JSON.stringify(data));
}

</script>

</body>
</html>

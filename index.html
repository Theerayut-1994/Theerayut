<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTTO PRO</title>

<style>
body { font-family: Arial; margin:10px; background:#f5f5f5; }

input, button {
 width:100%;
 padding:12px;
 font-size:16px;
 margin:5px 0;
}

label{
 font-weight:bold;
 margin-top:10px;
 display:block;
}

/* ช่อง บน / โต๊ด */
.row {
 display:flex;
 gap:20px; /* 👈 เพิ่มระยะห่าง */
}

.box {
 flex:1;
 padding:10px;
 background:white;
 border-radius:8px;
 box-shadow:0 0 5px rgba(0,0,0,0.1);
}

.box input{
 margin-top:5px;
}

.box label{
 display:block;
 margin-bottom:5px;
}

/* tag เลข */
.tag{
 background:#4CAF50;
 color:white;
 padding:6px 12px;
 border-radius:20px;
 margin:3px;
 display:inline-block;
 cursor:pointer;
}

/* ตาราง */
table {
 width:100%;
 border-collapse:collapse;
 margin-top:10px;
 background:white;
}

th, td {
 border:1px solid #ccc;
 padding:6px;
 text-align:center;
}

.delete{
 color:red;
 cursor:pointer;
 font-weight:bold;
}
</style>
</head>

<body>

<h3>LOTTO PRO</h3>

<label>ผู้บันทึกข้อมูล</label>
<input id="username">

<label>หมายเลข 3 ตัว</label>
<input id="numbers" inputmode="numeric" maxlength="3">
<div id="tags"></div>

<div class="row">
  <div class="box">
    <label>บน</label>
    <input id="direct" inputmode="numeric">
  </div>

  <div class="box">
    <label>โต๊ด</label>
    <input id="tod" inputmode="numeric">
  </div>
</div>

<button onclick="addItem()">เพิ่มรายการ</button>

<h4>ประวัติ</h4>
<table id="table">
<tr>
<th>#</th><th>เลข</th><th>บน</th><th>โต๊ด</th><th>คนคีย์</th><th>ลบ</th>
</tr>
</table>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwUaaLen3MSflYE0x5bMVYdcaibezNY5vEvPd8hXkNIgD8jHNneJCpOWIsze3TZKrkNNw/exec";

let data=[];
let tags=[];

// โหลดข้อมูล
function loadData(){
 fetch(API_URL)
 .then(res=>res.json())
 .then(res=>{
   data = res;
   render();
 });
}

// โหลดชื่อ (session)
window.onload=function(){
 loadData();
 let u=sessionStorage.getItem("user");
 if(u) username.value=u;
}

// จำชื่อ
username.oninput=function(){
 sessionStorage.setItem("user",this.value);
}

// รับเลข 3 ตัว → สร้าง tag
numbers.addEventListener("input",function(){
 let v=this.value.replace(/\D/g,"");
 if(v.length===3){
   addTag(v);
   this.value="";
 }
});

// เพิ่ม tag
function addTag(n){
 tags.push(n);

 let t=document.createElement("span");
 t.className="tag";
 t.innerHTML=n+" ❌";

 t.onclick=function(){
   tags = tags.filter(x=>x!=n);
   t.remove();
 }

 document.getElementById("tags").appendChild(t);
}

// permute
function perm(s){
 if(s.length<=1) return [s];
 let r=[];
 for(let i=0;i<s.length;i++){
  let rest=s.slice(0,i)+s.slice(i+1);
  perm(rest).forEach(p=>r.push(s[i]+p));
 }
 return [...new Set(r)];
}

// เพิ่มข้อมูล
function addItem(){

 let u=username.value;
 if(!u) return alert("กรอกชื่อก่อน");

 let d=parseFloat(direct.value)||0;
 let t=parseFloat(tod.value)||0;

 let sendData=[];

 tags.forEach(num=>{

 let unique = new Set(num).size;

 // 🔥 กรณี 333 (ซ้ำ 3 ตัว)
 if(unique === 1){

   sendData.push({
     num:num,
     d:(d + t), // 👈 รวม บน + โต๊ด
     t:0,
     user:u
   });

 }

 // 🔥 กรณี 133 (ซ้ำบางตัว)
 else if(unique === 2){

   let p = perm(num);

   let base=Math.floor(t/p.length);
   let rem=t%p.length;

   p.forEach((x,i)=>{
     let amt=base+(i<rem?1:0);
     sendData.push({num:x,d:amt,t:0,user:u});
   });

   // บนตรง
   if(d){
     sendData.push({num:num,d:d,t:0,user:u});
   }

 }

 // 🔥 กรณี 123 (ไม่ซ้ำ)
 else{

   sendData.push({
     num:num,
     d:d,
     t:t,
     user:u
   });

 }

});

 fetch(API_URL,{
  method:"POST",
  headers:{
    "Content-Type":"application/json" // 👈 เพิ่มบรรทัดนี้
  },
  body:JSON.stringify({
    delete:true,
    row:Number(row)
  })
})

 // reset
 tags=[];
 document.getElementById("tags").innerHTML="";
 direct.value="";
 tod.value="";
}

// ลบ
function deleteItem(row){

 fetch(API_URL + "?delete=1&row=" + row)
 .then(()=>loadData());

}

// render
function render(){

 let tb=document.getElementById("table");

 tb.innerHTML=`
 <tr>
 <th>#</th><th>เลข</th><th>บน</th><th>โต๊ด</th><th>คนคีย์</th><th>ลบ</th>
 </tr>`;

 let show=[...data].reverse();

 show.forEach((x,i)=>{

  let r=tb.insertRow();

  r.insertCell(0).innerText=i+1;
  r.insertCell(1).innerText=x.num;
  r.insertCell(2).innerText=x.d ? x.d.toFixed(2) : "-";
  r.insertCell(3).innerText=x.t ? x.t.toFixed(2) : "-";
  r.insertCell(4).innerText=x.user;

  let del=r.insertCell(5);
  del.innerHTML="<span class='delete'>ลบ</span>";
  del.onclick=()=>deleteItem(x.row);

 });

}

</script>

</body>
</html>

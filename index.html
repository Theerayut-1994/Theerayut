<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTTO PRO</title>

<style>
*{box-sizing:border-box;}
body{font-family:Arial;margin:0;padding:10px;background:#f2f4f7;}
.container{max-width:500px;margin:auto;}
.card{background:white;padding:15px;border-radius:15px;margin-bottom:15px;box-shadow:0 4px 10px rgba(0,0,0,0.08);}
h3{text-align:center;}
label{font-weight:bold;}
input{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ccc;font-size:16px;}
.row{display:flex;gap:10px;}
button{width:100%;padding:15px;background:#4CAF50;color:white;border:none;border-radius:10px;font-size:16px;}

.tag{background:#4CAF50;color:white;padding:8px 12px;border-radius:20px;margin:3px;display:inline-block;cursor:pointer;}

table{width:100%;border-collapse:collapse;}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:center;}
th{background:#4CAF50;color:white;}

.delete{font-size:20px;cursor:pointer;}
</style>
</head>

<body>

<div class="container">

<h3>LOTTO PRO</h3>

<div class="card">

<label>ผู้บันทึกข้อมูล</label>
<input id="username">

<label>หมายเลข 3 ตัว</label>
<input id="numbers" inputmode="numeric">
<div id="tags"></div>

<div class="row">
 <div>
  <label>บน</label>
  <input id="direct">
 </div>
 <div>
  <label>โต๊ด</label>
  <input id="tod">
 </div>
</div>

<button onclick="addItem()">เพิ่มรายการ</button>

</div>

<div class="card">
<table id="table"></table>
</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbz1cfPY9TdrXrUDBdMvzqWskbT1VJOpu7_JcU27uhhUf03wDWYBaOAYT-rzmILavMW6Mg/exec";

let data=[];
let tags=[];
let deletedIds = new Set();

// ================= LOAD =================
function loadData(){
 fetch(API_URL)
 .then(r=>r.json())
 .then(r=>{

   // 🔥 เอาของในเว็บไว้ก่อน
   let current = data;

   // 🔥 กรองตัวที่ลบออก
   let fromSheet = r.filter(x => !deletedIds.has(x.id));

   // 🔥 รวมข้อมูล (กันหาย)
   let merged = [...current];

// 🔥 เอาเฉพาะตัวที่ไม่ pending
let current = data.filter(x => !x.pending);

   fromSheet.forEach(x=>{
     // ถ้ายังไม่มีใน data ค่อยเพิ่ม
     if(!merged.find(y => y.id == x.id)){
       merged.push(x);
     }
   });

   data = merged;

   render();
 });
}

window.onload = () => {
  loadData();

  // 🔥 โหลดซ้ำทุก 5 วิ (sync กับ Google)
  setInterval(loadData,5000);
};
// ================= TAG =================
numbers.addEventListener("input",function(){
 let v=this.value.replace(/\D/g,"");
 if(v.length===3){
   addTag(v);
   this.value="";
 }
});

function addTag(n){
 tags.push(n);

 let t=document.createElement("span");
 t.className="tag";
 t.innerHTML=n+" ❌";

 t.onclick=()=>{
   tags = tags.filter(x=>x!=n);
   t.remove();
 };

 document.getElementById("tags").appendChild(t);
}

// ================= PERM =================
function perm(s){
 if(s.length<=1) return [s];
 let r=[];
 for(let i=0;i<s.length;i++){
  let rest=s.slice(0,i)+s.slice(i+1);
  perm(rest).forEach(p=>r.push(s[i]+p));
 }
 return [...new Set(r)];
}

// ================= ADD =================
function addItem(){

 let u=username.value;
 if(!u) return alert("กรอกชื่อก่อน");

 let d=parseFloat(direct.value)||0;
 let t=parseFloat(tod.value)||0;

 let send=[];

 tags.forEach(num=>{

  let unique=new Set(num).size;

  if(unique===1){
    send.push({num:num,d:d+t,t:0,user:u});
  }
  else if(unique===2){

    let p=perm(num);
    let base=Math.floor(t/p.length);
    let rem=t%p.length;

    p.forEach((x,i)=>{
      send.push({num:x,d:base+(i<rem?1:0),t:0,user:u});
    });

    if(d) send.push({num:num,d:d,t:0,user:u});
  }
  else{
    send.push({num:num,d:d,t:t,user:u});
  }

 });

 // 🔥 1. แสดงผลทันที
 send.forEach(x=>{
  data.push({
  id: Date.now()+Math.random(),
  num: x.num,
  d: x.d,
  t: x.t,
  user: x.user,
  pending: true // 🔥 เพิ่ม
});

 render();

 // 🔥 2. ค่อยส่งไป Google
 fetch(API_URL,{
  method:"POST",
  headers:{
    "Content-Type":"application/json"
  },
  body: JSON.stringify(send),
  mode:"no-cors"
 });

 // 🔥 3. รีโหลดข้อมูลจริงทีหลัง (กัน id เพี้ยน)
 setTimeout(loadData,1000);

 tags=[];
 document.getElementById("tags").innerHTML="";
 direct.value="";
 tod.value="";
}
// ================= DELETE =================
function deleteItem(id){

 // 🔥 จำว่าอันนี้ลบแล้ว
 deletedIds.add(id);

 // 🔥 ลบจากหน้าจอทันที
 data = data.filter(x => x.id != id);
 render();

 // 🔥 ยิง API
 fetch(API_URL,{
   method:"POST",
   headers:{
     "Content-Type":"application/json"
   },
   body: JSON.stringify({
     delete:true,
     id:id
   }),
   mode:"no-cors"
 });

 // 🔥 sync จริง
 setTimeout(loadData,1500);

 // 🔥 เคลียร์ cache หลัง 5 วิ
 setTimeout(()=>{
   deletedIds.clear();
 },5000);
}// ================= RENDER =================
function render(){

 let tb=document.getElementById("table");

 tb.innerHTML=`
 <tr>
 <th>#</th><th>เลข</th><th>บน</th><th>โต๊ด</th><th>คน</th><th>ลบ</th>
 </tr>`;

 let show = data.slice().reverse();

 show.forEach((x,i)=>{

  let r=tb.insertRow();

  r.insertCell(0).innerText = show.length - i;
  r.insertCell(1).innerText = x.num;
  r.insertCell(2).innerText = x.d || "-";
  r.insertCell(3).innerText = x.t || "-";
  r.insertCell(4).innerText = x.user;

  let del=r.insertCell(5);
  del.innerHTML="<span class='delete'>❌</span>";
  del.onclick=()=> deleteItem(x.id);

 });

}

</script>

</body>
</html>
